<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TICK // CHARACTER SHEET</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#111;display:grid;place-items:center;min-height:100vh}canvas{max-width:100%}</style>
</head>
<body>
<canvas id="sheet" width="1800" height="1150"></canvas>
<script src="mascot.js"></script>
<script>
const c = document.getElementById("sheet").getContext("2d");
const W = 1800, H = 1150;
const ACID = "#CCFF00", WHITE = "#F2EFE9", DIM = "#8A8F94";

function T(s, x, y, o){
  o = o || {};
  c.save();
  c.font = `${o.w||500} ${o.s||18}px ${o.mono ? "'JetBrains Mono',monospace" : "'Inter Tight',sans-serif"}`;
  if ("letterSpacing" in c) c.letterSpacing = (o.t||0) + "px";
  c.fillStyle = o.c || WHITE; c.textAlign = o.a || "left";
  c.fillText(s, x, y); c.restore();
}

function draw(){
  c.fillStyle = "#08090A"; c.fillRect(0,0,W,H);
  T("TICK", 70, 92, { s:64, w:600, t:-3 });
  T("THE SMALLEST MOVE A PRICE CAN MAKE", 250, 88, { s:18, mono:true, t:5, c:DIM });
  T("He is the acid bar from the mark, stood up. Body always acid, visor always graphite, eyes always warm white.",
    70, 128, { s:19, mono:true, t:1, c:DIM });
  c.fillStyle = "rgba(242,239,233,.12)"; c.fillRect(70, 158, W-140, 1);

  const poses = [
    ["IDLE", "idle", "neutral", "right", "up"],
    ["POINT", "point", "focus", "right", "up"],
    ["POINT UP", "point", "wide", "up", "up"],
    ["THINK", "think", "focus", "left", "flat"],
    ["CHEER", "cheer", "happy", "right", "up"],
    ["CONFUSED", "confused", "confused", "left", "flat"],
    ["HOLD", "hold", "neutral", "right", "down"],
    ["PRESS", "press", "focus", "right", "up"],
  ];
  poses.forEach((p, i) => {
    const x = 160 + (i % 4) * 268, y = 360 + Math.floor(i / 4) * 370;
    c.save();
    c.strokeStyle = "rgba(242,239,233,.08)"; c.lineWidth = 1;
    c.strokeRect(x - 120, y - 185, 240, 310);
    c.restore();
    MASCOT.draw(c, { x, y, s: 168, pose: p[1], expr: p[2], dir: p[3], tick: p[4], t: i * 0.7, blink: false });
    T(p[0], x, y + 158, { s:16, mono:true, t:3, c:DIM, a:"center" });
  });

  // scale test: he has to read at the size a feed shows him
  const sizes = [190, 120, 70, 40, 24];
  let sx = 1240;
  T("HE HAS TO READ SMALL", 1240, 300, { s:17, mono:true, t:3.4, c:DIM });
  sizes.forEach(s => {
    MASCOT.draw(c, { x: sx + s*0.35, y: 420, s, pose:"idle", expr:"neutral", t:0, blink:false, shadow:false });
    T(s + "PX", sx + s*0.35, 545, { s:13, mono:true, t:2, c:"#5C6166", a:"center" });
    sx += s * 0.8 + 26;
  });

  // a label in his visor readout
  T("HE CAN CARRY A NUMBER", 1240, 660, { s:17, mono:true, t:3.4, c:DIM });
  MASCOT.draw(c, { x: 1360, y: 830, s: 178, pose:"hold", expr:"focus", tick:"up", label:"67", t:0, blink:false });
  MASCOT.draw(c, { x: 1600, y: 830, s: 178, pose:"idle", expr:"confused", tick:"flat", label:"51/49", t:0, blink:false });

  T("BODY #CCFF00   //   VISOR #08090A   //   EYES AND ARMS #F2EFE9   //   NEVER RECOLOURED",
    70, H - 50, { s:17, mono:true, t:3.4, c:DIM });
}

document.fonts.ready.then(async () => {
  draw();
  const b = await new Promise(r => document.getElementById("sheet").toBlob(r, "image/png"));
  try { await fetch("/_save/tick-sheet.png", { method:"POST", body:b }); } catch(e){}
  window.__ready = true;
});
</script>
</body>
</html>
