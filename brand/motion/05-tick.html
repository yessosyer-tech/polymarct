<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TICK // POLYMARCT MOTION 05</title>
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="motion.css">
<style>
  #gate{position:fixed;inset:0;z-index:200;background:#000;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:24px;cursor:pointer}
  #gate .big{font-size:clamp(38px,6vw,92px);font-weight:600;letter-spacing:-4px;text-transform:uppercase;line-height:.9;text-align:center}
  #gate .sub{font-family:var(--mono);font-size:13px;letter-spacing:5px;color:var(--dim);text-transform:uppercase;text-align:center}
  #gate .cta{border:1px solid var(--acid);color:var(--acid);font-family:var(--mono);font-size:15px;
    letter-spacing:7px;padding:18px 40px;text-transform:uppercase}
  #gate.gone{display:none}
  .badge{position:fixed;right:16px;top:16px;z-index:150;font-family:var(--mono);font-size:10px;
    letter-spacing:3px;color:var(--dim)}
  .badge.gone{display:none}
</style>
</head>
<body>

<div id="stage"><canvas class="layer" id="cv"></canvas></div>
<div class="badge" id="badge">M MUTE // R RESTART</div>

<div id="gate">
  <div class="sub">POLYMARCT // TICK // 24 SECONDS</div>
  <div class="big">Meet the<br>last price.</div>
  <div class="cta" id="play">PRESS PLAY</div>
  <div class="sub">SOUND ON</div>
</div>

<script src="motion.js"></script>
<script src="../mascot.js"></script>
<script src="recorder.js"></script>
<script src="render.js"></script>
<script>
/* ============================================================
   POLYMARCT // TICK
   He comes out of the mark, walks through the product and points at the
   things that matter. Canvas only, so the offline renderer can take it frame
   by frame, and cut on the same grid as the trailer.
   ============================================================ */

const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const off = document.createElement("canvas"); off.width = 1920; off.height = 1080;
const octx = off.getContext("2d");
cv.width = 1920; cv.height = 1080;

const E = MO.E, lerp = MO.lerp, clamp = MO.clamp, inv = MO.inv, T = MO.text;
const ACID = "#CCFF00", WHITE = "#F2EFE9", BLACK = "#08090A", DIM = "#8A8F94", NO = "#FF4D2E";
const field = new MO.Field(1920, 1080, "tickfilm", 150);
const DUR = 24;
let NOW = 0;
const P = { shake: 0, chroma: 0 };

/* ---------- treatment, baked so the file matches the screen ---------- */
const NOISE = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const x = c.getContext("2d"), img = x.createImageData(256,256), d = img.data;
  for (let i=0;i<d.length;i+=4){ const v = 128 + (Math.random()-.5)*255; d[i]=d[i+1]=d[i+2]=v; d[i+3]=255; }
  x.putImageData(img,0,0); return c;
})();
const SCAN = (() => {
  const c = document.createElement("canvas"); c.width = 4; c.height = 4;
  const x = c.getContext("2d"); x.fillStyle = "rgba(242,239,233,.075)"; x.fillRect(0,0,4,1); return c;
})();
let VIG = null;
function treatment(c){
  if (!VIG){
    VIG = c.createRadialGradient(960,540,320, 960,540,1180);
    VIG.addColorStop(0,"rgba(0,0,0,0)"); VIG.addColorStop(1,"rgba(0,0,0,.70)");
  }
  c.save();
  c.globalAlpha = .14; c.fillStyle = c.createPattern(SCAN,"repeat"); c.fillRect(0,0,1920,1080);
  c.globalAlpha = .06; c.globalCompositeOperation = "overlay";
  const ox = (Math.random()*256)|0, oy = (Math.random()*256)|0;
  for (let x=-ox;x<1920;x+=256) for (let y=-oy;y<1080;y+=256) c.drawImage(NOISE,x,y);
  c.globalCompositeOperation = "source-over"; c.globalAlpha = 1;
  c.fillStyle = VIG; c.fillRect(0,0,1920,1080);
  c.restore();
}

/* ---------- pieces of the product he walks through ---------- */
function ground(a){
  octx.fillStyle = BLACK; octx.fillRect(0,0,1920,1080);
  octx.strokeStyle = "rgba(242,239,233,.05)"; octx.lineWidth = 1;
  octx.beginPath();
  for (let x=160;x<1920;x+=160){ octx.moveTo(x+.5,0); octx.lineTo(x+.5,1080); }
  octx.stroke();
  if (a) field.draw(octx, NOW, { speed: a.speed || .6, alpha: a.alpha === undefined ? .35 : a.alpha });
}
function say(line, y, size, col){
  T(octx, line, 150, y || 200, { size: size || 58, weight:600, color: col || WHITE, track: -(size||58)*0.04 });
}
function mono(line, x, y, size, col, track){
  T(octx, line, x, y, { size: size||20, mono:true, color: col||DIM, track: track===undefined?3:track });
}
function panel(x, y, w, h, hot){
  octx.save();
  octx.shadowColor = "rgba(0,0,0,.8)"; octx.shadowBlur = 70; octx.shadowOffsetY = 28;
  octx.fillStyle = "#0D0F11"; octx.fillRect(x,y,w,h);
  octx.restore();
  octx.strokeStyle = hot ? ACID : "rgba(242,239,233,.22)";
  octx.lineWidth = hot ? 2.5 : 1.5;
  octx.strokeRect(x+.5,y+.5,w,h);
}
function marketCard(x, y, w, reveal, priceShown){
  const h = w*0.62;
  panel(x, y, w, h, false);
  mono("CRYPTO", x+30, y+52, 18, DIM, 4);
  T(octx, "Will BTC reach $125,000", x+30, y+110, { size:34, weight:500, color:WHITE, track:-1 });
  T(octx, "before October 31?", x+30, y+152, { size:34, weight:500, color:WHITE, track:-1 });
  if (reveal > 0){
    const p = priceShown === undefined ? 67 : priceShown;
    T(octx, Math.round(p) + "%", x+30, y+h-76, { size:84, weight:600, color:WHITE, track:-4, alpha:reveal });
    octx.globalAlpha = reveal;
    octx.fillStyle = "rgba(242,239,233,.12)"; octx.fillRect(x+30, y+h-54, w-60, 9);
    octx.fillStyle = ACID; octx.fillRect(x+30, y+h-54, (w-60)*(p/100), 9);
    octx.globalAlpha = 1;
    mono("$4.82M VOL   //   18,421 TRADERS", x+30, y+h-22, 16, DIM, 2);
  }
  return { price: { x: x+100, y: y+h-104 } };
}
const SER = [.44,.45,.43,.46,.45,.51,.60,.59,.62,.61,.65,.73,.72,.75,.77,.79];
function chart(x, y, w, h, reveal){
  const n = Math.max(2, Math.round(SER.length*reveal));
  const px = i => x + (i/(SER.length-1))*w, py = v => y + h - (v-.38)*h*1.9;
  octx.beginPath(); octx.moveTo(x, y+h);
  for (let i=0;i<n;i++) octx.lineTo(px(i), py(SER[i]));
  octx.lineTo(px(n-1), y+h); octx.closePath();
  octx.fillStyle = "rgba(204,255,0,.09)"; octx.fill();
  octx.beginPath();
  for (let i=0;i<n;i++) i?octx.lineTo(px(i),py(SER[i])):octx.moveTo(px(i),py(SER[i]));
  octx.strokeStyle = ACID; octx.lineWidth = 4; octx.stroke();
  octx.fillStyle = "rgba(242,239,233,.22)"; octx.fillRect(x, y+h, w, 1);
  return { x: px(n-1), y: py(SER[n-1]) };
}

/* ---------- the cut list ---------- */
const SHOTS = [];
const shot = (t, dur, draw) => SHOTS.push({ t, dur, draw });

/* 00.0 he climbs out of the mark */
shot(0, 3.2, p => {
  ground({ speed: lerp(5,.6,E.outExpo(clamp(p*2,0,1))), alpha: .3 });
  const s = 300;
  MO.drawMark(octx, 960 - s/2, 430 - s/2, s, { draw: E.outExpo(clamp(p*2.4,0,1)) });
  if (p > .42){
    const k = E.settle(clamp(inv(p,.42,.8),0,1));
    MASCOT.draw(octx, { x: 960, y: lerp(430, 700, k), s: lerp(60, 210, k),
                        pose:"idle", expr: p > .7 ? "happy" : "wide", dir:"right", t: NOW });
  }
  if (p > .62){
    const a = clamp(inv(p,.62,.85),0,1);
    T(octx, "MEET TICK", 960, 900, { size:56, weight:600, color:WHITE, align:"center", track:-2, alpha:a });
    T(octx, "THE SMALLEST MOVE A PRICE CAN MAKE", 960, 946,
      { size:20, mono:true, color:DIM, align:"center", track:5, alpha:a });
  }
  P.chroma = p < .06 ? 14 : 1; P.shake = p < .06 ? 12 : 0;
});

/* 03.2 a question with one answer */
shot(3.2, 3.4, p => {
  ground({ speed:.6, alpha:.28 });
  say("A question with one answer.", 190);
  const slide = E.outExpo(clamp(p*2.2,0,1));
  const info = marketCard(lerp(-700, 150, slide), 300, 780, clamp(inv(p,.42,.7),0,1));
  MASCOT.draw(octx, { x: 1420, y: 560, s: 250, pose:"point", dir:"left",
                      expr:"focus", t: NOW, blink:false });
  if (p > .5) MASCOT.pointerLine(octx, { x: 1300, y: 542 }, { x: 560, y: 410 });
  P.chroma = p < .08 ? 10 : .8; P.shake = p < .08 ? 8 : 0;
});

/* 06.6 and a price */
shot(6.6, 3.4, p => {
  ground({ speed:.6, alpha:.28 });
  say("And a price.", 190);
  const info = marketCard(150, 300, 780, 1);
  MASCOT.draw(octx, { x: 1420, y: 560, s: 250, pose:"point", dir:"left",
                      expr:"focus", tick:"up", t: NOW, blink:false });
  MASCOT.pointerLine(octx, { x: 1300, y: 542 }, info.price);
  const a = clamp(inv(p,.28,.55),0,1);
  T(octx, "67 cents", 1050, 320, { size:54, weight:600, color:ACID, track:-2.2, alpha:a });
  const b = clamp(inv(p,.45,.75),0,1);
  mono("buys one dollar", 1050, 372, 24, WHITE, 1);
  mono("if this happens", 1050, 406, 24, WHITE, 1);
  octx.globalAlpha = 1;
  P.chroma = p < .08 ? 10 : .8; P.shake = p < .08 ? 8 : 0;
});

/* 10.0 it moves */
shot(10.0, 3.8, p => {
  ground({ speed: lerp(.6, 2.2, p), alpha:.3 });
  say("It moves when somebody", 180, 54);
  say("knows something first.", 236, 54, ACID);
  const reveal = clamp(inv(p,.08,.72),0,1);
  const tip = chart(150, 480, 1080, 360, reveal);
  MASCOT.draw(octx, { x: tip.x + 120, y: tip.y - 40, s: 190, pose:"point", dir:"left",
                      expr:"wide", tick:"up", t: NOW, blink:false });
  if (p > .76){
    const a = clamp(inv(p,.76,.95),0,1);
    T(octx, "+8¢ IN FOUR MINUTES", 1380, 900, { size:26, mono:true, color:ACID, align:"right", track:4, alpha:a });
  }
  P.chroma = p < .07 ? 11 : 1; P.shake = p < .07 ? 9 : 0;
});

/* 13.8 you take a side */
shot(13.8, 3.4, p => {
  ground({ speed:.8, alpha:.26 });
  say("You take a side.", 190);
  panel(150, 300, 700, 420, p > .45);
  mono("TAKE A POSITION", 182, 352, 18, DIM, 4);
  const pressed = p > .45;
  octx.fillStyle = pressed ? ACID : "#171A1E";
  octx.fillRect(182, 384, 320, 62);
  T(octx, "TAKE YES  67¢", 202, 424, { size:24, mono:true, weight:700,
    color: pressed ? BLACK : ACID, track:2 });
  octx.fillStyle = "#171A1E"; octx.fillRect(518, 384, 314, 62);
  T(octx, "TAKE NO  33¢", 538, 424, { size:24, mono:true, color:NO, track:2 });
  [["AMOUNT","100.00 USDC"],["SHARES","149.25 YES"],["PAYOUT IF CORRECT","$149.25"]].forEach(([k,v],i)=>{
    const y = 500 + i*54;
    mono(k, 182, y, 17, DIM, 2.6);
    T(octx, v, 818, y, { size:21, mono:true, color: i===2?ACID:WHITE, align:"right" });
  });
  MASCOT.draw(octx, { x: 1080, y: 540, s: 240, pose: pressed ? "cheer" : "press",
                      dir:"left", expr: pressed ? "happy" : "focus", t: NOW, blink:false });
  const a = clamp(inv(p,.55,.8),0,1);
  T(octx, "POSITION", 1320, 480, { size:44, weight:600, color:WHITE, track:-1.6, alpha:a });
  T(octx, "CONFIRMED", 1320, 532, { size:44, weight:600, color:ACID, track:-1.6, alpha:a });
  mono("SETTLES IN USDC ON ARC", 1320, 586, 18, DIM, 3.4);
  P.chroma = p < .07 ? 11 : (pressed && p < .49 ? 8 : 1);
  P.shake = p < .07 ? 9 : (pressed && p < .49 ? 7 : 0);
});

/* 17.2 reality decides */
shot(17.2, 3.4, p => {
  ground({ speed:.5, alpha:.22 });
  say("Reality decides.", 190);
  panel(150, 300, 900, 300, true);
  mono("THE VERDICT ENGINE", 182, 352, 18, DIM, 4);
  [["SOURCE","COINBASE BTC-USD, HOURLY CLOSE"],
   ["READING","$125,412.00"],
   ["DISPUTE WINDOW","CLOSED, NO CHALLENGE"]].forEach(([k,v],i)=>{
    const y = 412 + i*56;
    mono(k, 182, y, 17, DIM, 2.6);
    T(octx, v, 1018, y, { size:19, mono:true, color: i===1?ACID:WHITE, align:"right" });
  });
  const k = E.settle(clamp(inv(p,.22,.5),0,1));
  MASCOT.draw(octx, { x: 1380, y: 520, s: lerp(160, 260, k), pose:"hold", dir:"left",
                      expr:"happy", tick:"up", label: p > .3 ? "YES" : "", t: NOW, blink:false });
  const a = clamp(inv(p,.55,.78),0,1);
  mono("THE SOURCE WAS NAMED BEFORE ANYONE TRADED", 150, 800, 22, DIM, 3.4);
  octx.globalAlpha = 1;
  P.chroma = p < .07 ? 12 : 1; P.shake = p < .07 ? 10 : 0;
});

/* 20.6 the market pays */
shot(20.6, 2.2, p => {
  ground({ speed:.6, alpha:.26 });
  say("The market pays.", 190);
  const v = 149.25 * E.outExpo(clamp(p*1.8,0,1));
  T(octx, "$" + v.toFixed(2), 150, 560, { size:190, weight:600, color:WHITE, track:-10 });
  mono("SETTLED IN USDC ON ARC", 150, 620, 24, ACID, 5);
  MASCOT.draw(octx, { x: 1420, y: 540, s: 260, pose:"cheer", dir:"left",
                      expr:"happy", tick:"up", t: NOW, blink:false });
  P.chroma = p < .1 ? 13 : 1; P.shake = p < .1 ? 11 : 0;
});

/* 22.8 the lock, he sits back in the gap */
shot(22.8, 1.2, p => {
  ground({ speed:.4, alpha:.22 });
  const s = 240;
  MO.drawMark(octx, 960 - s/2, 380 - s/2, s, { draw:1 });
  MASCOT.draw(octx, { x: 960, y: lerp(700, 392, E.inOutCubic(clamp(p*1.6,0,1))),
                      s: lerp(200, 74, E.inOutCubic(clamp(p*1.6,0,1))),
                      pose:"idle", expr:"happy", t: NOW, shadow:false, blink:false });
  const a = clamp(inv(p,.3,.6),0,1);
  T(octx, "POLYMARCT", 960, 640, { size:110, weight:600, color:WHITE, align:"center", track:-5, alpha:a });
  T(octx, "THE FUTURE HAS A PRICE.", 960, 700, { size:24, mono:true, color:ACID, align:"center", track:7, alpha:a });
  T(octx, "$PMARC // SETTLES IN USDC ON ARC", 960, 748,
    { size:18, mono:true, color:DIM, align:"center", track:5, alpha: clamp(inv(p,.5,.8),0,1) });
  if (p > .9){ const f = inv(p,.9,1); octx.fillStyle = "rgba(8,9,10," + f + ")"; octx.fillRect(0,0,1920,1080); }
  P.chroma = p < .08 ? 12 : lerp(2,0,clamp(p*2,0,1)); P.shake = 0;
});

/* ---------- render ---------- */
function renderAt(t){
  NOW = t;
  P.chroma = 0; P.shake = 0;
  let cur = SHOTS[SHOTS.length-1];
  for (const s of SHOTS) if (t >= s.t && t < s.t + s.dur) cur = s;
  const p = clamp((t - cur.t)/cur.dur, 0, 1);
  octx.save(); cur.draw(p, t); octx.restore();

  ctx.fillStyle = "#000"; ctx.fillRect(0,0,1920,1080);
  const sx = (Math.random()-.5)*P.shake, sy = (Math.random()-.5)*P.shake;
  ctx.drawImage(off, sx, sy);
  if (P.chroma > .5){
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = .15;
    ctx.drawImage(off, sx - P.chroma, sy);
    ctx.drawImage(off, sx + P.chroma, sy);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  }
  treatment(ctx);
}

/* ---------- the score: lighter than the trailer, same grid ---------- */
let AC = null, master = null, muted = false, NB = null;
function noiseBuf(){
  const n = AC.sampleRate*3, b = AC.createBuffer(1,n,AC.sampleRate), d = b.getChannelData(0);
  for (let i=0;i<n;i++) d[i] = Math.random()*2-1;
  return b;
}
function boom(t,f0,f1,dur,g){
  const o = AC.createOscillator(), gg = AC.createGain();
  o.type="sine"; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  gg.gain.setValueAtTime(0.0001,t); gg.gain.exponentialRampToValueAtTime(g,t+.012);
  gg.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(gg).connect(master); o.start(t); o.stop(t+dur+.05);
}
function blip(t, f, dur, g){
  const o = AC.createOscillator(), gg = AC.createGain();
  o.type = "square"; o.frequency.setValueAtTime(f, t);
  o.frequency.exponentialRampToValueAtTime(f*1.6, t+dur);
  gg.gain.setValueAtTime(0.0001,t); gg.gain.exponentialRampToValueAtTime(g,t+.008);
  gg.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(gg).connect(master); o.start(t); o.stop(t+dur+.05);
}
function hit(t,g){
  const s = AC.createBufferSource(); s.buffer = NB;
  const hp = AC.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=1500;
  const gg = AC.createGain(); gg.gain.setValueAtTime(g,t);
  gg.gain.exponentialRampToValueAtTime(0.0001,t+.08);
  s.connect(hp).connect(gg).connect(master); s.start(t); s.stop(t+.12);
}
function sub(t,dur,g,f){
  const o = AC.createOscillator(), gg = AC.createGain();
  o.type="sine"; o.frequency.value=f||44;
  gg.gain.setValueAtTime(0.0001,t); gg.gain.exponentialRampToValueAtTime(g,t+.4);
  gg.gain.setValueAtTime(g,t+dur-.4); gg.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(gg).connect(master); o.start(t); o.stop(t+dur+.05);
}
function scheduleScore(T0){
  NB = noiseBuf();
  boom(T0, 140, 34, 1.2, .8); hit(T0, .4);
  sub(T0, 3.2, .26);
  [0.9,1.2,1.5].forEach((d,i)=> blip(T0+d, 420 + i*180, .12, .09));   // he climbs out
  const beats = [3.2, 6.6, 10.0, 13.8, 17.2, 20.6, 22.8];
  beats.forEach((b,i) => {
    boom(T0+b, 150, 40, .5, .55);
    hit(T0+b, .3);
    blip(T0+b+.08, 520, .10, .07);
    sub(T0+b, Math.min(3.4, (beats[i+1]||DUR) - b), .22);
  });
  for (let k=0;k<26;k++) hit(T0 + 3.4 + k*.5, .07);                    // a light pulse under the middle
  blip(T0+14.4, 680, .16, .12); blip(T0+14.55, 880, .2, .1);           // the press
  boom(T0+17.3, 180, 32, 1.1, .75); hit(T0+17.3, .42);                 // the verdict
  for (let k=0;k<8;k++) blip(T0 + 20.7 + k*.12, 420 + k*90, .1, .08);  // the payout counting
  boom(T0+22.85, 200, 28, 2.2, .9); hit(T0+22.85, .5);
  sub(T0+22.85, 2.0, .24, 38);
}

/* ---------- transport ---------- */
const q = new URLSearchParams(location.search);
const rec = q.get("rec") === "1";
if (rec) document.getElementById("badge").classList.add("gone");
function fit(){
  const s = Math.min(innerWidth/1920, innerHeight/1080);
  document.getElementById("stage").style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener("resize", fit, { passive:true }); fit();

let t0 = 0, running = false, lastT = 0;
function start(){
  document.getElementById("gate").classList.add("gone");
  if (!AC){
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted ? 0 : .8;
    const comp = AC.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 7;
    master.connect(comp).connect(AC.destination);
  }
  AC.resume();
  scheduleScore(AC.currentTime + .06);
  t0 = performance.now()/1000;
  running = true;
  if (recorder && recorder.auto) recorder.start();
}
function restart(){ if (AC){ master.disconnect(); AC.close(); AC = null; } start(); }
document.getElementById("gate").onclick = start;
addEventListener("keydown", e => {
  if (e.code === "Space"){ e.preventDefault(); running = !running; if (running) t0 = performance.now()/1000 - lastT; }
  if (e.key === "r" || e.key === "R") restart();
  if (e.key === "m" || e.key === "M"){ muted = !muted; if (master) master.gain.value = muted ? 0 : .8; }
  if (e.key === "h" || e.key === "H") document.getElementById("badge").classList.toggle("gone");
});

const recorder = REC.attach({
  canvas: cv, duration: DUR, name: "polymarct-05-tick",
  get audioNode(){ return master; }, get audioContext(){ return AC; }
});

(function loop(){
  requestAnimationFrame(loop);
  if (!running){ renderAt(lastT); return; }
  let t = performance.now()/1000 - t0;
  if (t > DUR){
    if (recorder && recorder.auto){ running = false; renderAt(DUR - .01); recorder.stop(); return; }
    restart(); t = 0;
  }
  lastT = t;
  renderAt(t);
})();

window.seek = t => { lastT = t; running = false; renderAt(t); };
window.FILM = {
  canvas: cv, duration: DUR, name: "polymarct-05-tick",
  seek: t => renderAt(t),
  renderAudio: async () => {
    const OAC = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(2, Math.ceil(44100*(DUR+1.5)), 44100);
    const pAC = AC, pM = master;
    AC = OAC;
    master = OAC.createGain(); master.gain.value = .8;
    const comp = OAC.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 7;
    master.connect(comp).connect(OAC.destination);
    scheduleScore(0.05);
    const buf = await OAC.startRendering();
    AC = pAC; master = pM;
    return buf;
  }
};
renderAt(0);
</script>
</body>
